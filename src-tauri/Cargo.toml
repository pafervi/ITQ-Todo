[package]
name = "itq-todo"
version = "2.2.0"
description = "Personal planner and lab notebook for computational catalysis research at ITQ (UPV-CSIC)"
authors = ["Pau Ferri-Vicedo <pauferrivi@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
# Required so Tauri can build the mobile crate variant later; harmless on desktop.
name = "itq_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-autostart = "2.0"
tauri-plugin-single-instance = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Enables the custom app:// protocol in production builds. The dev build
# serves the renderer from Vite's dev server at http://localhost:8080.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
