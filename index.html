<!DOCTYPE html>
<html lang="en">

<head>
  <title>ITQ Todo</title>

  <!-- Page meta tags -->
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" href="./favicon.ico">

  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <meta name="description"
    content="ITQ Todo is a personal weekly planner for research workflow: to-do lists, a weekly calendar and project trackers, all stored locally.">
  <meta name="keywords" content="ITQ Todo, Weekly Planner, Research Planner, To-do App">

  <!-- Open Graph -->
  <meta property="og:type" content="application">
  <meta property="og:site_name" content="ITQ Todo" />
  <meta property="og:title" content="ITQ Todo">
  <meta property="og:description"
    content="ITQ Todo is a personal weekly planner for research workflow, with to-do lists, a weekly calendar and project trackers, all stored locally.">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ITQ Todo">
  <meta name="twitter:description"
    content="ITQ Todo is a personal weekly planner for research workflow, with to-do lists, a weekly calendar and project trackers, all stored locally.">

  <link rel="icon" type="image/png" sizes="32x32" href="./fav_icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./fav_icons/favicon-16x16.png">
  <meta name="theme-color" content="#5e6ef2">

  <!-- Editorial display serif used for the day greeting and project
       titles. Preconnect + swap keeps the first paint fast and avoids
       FOUT jumps in the UI. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
</head>

<body>

  </noscript>
  <div id="app"></div>

</body>

</html>
